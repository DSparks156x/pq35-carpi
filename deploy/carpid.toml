# carpid config. Copy to ~/.config/carpi/carpid.toml.
#
# Buses are named by role. `iface` is whatever the interface is called;
# naming interfaces with systemd-networkd .link files (e.g. "ican", "obd")
# beats relying on can0/can1 numbering.

[bus.ican]
iface = "can0"

# TT: the gateway routes diagnostics from ICAN, so diag shares it.
# Cars whose gateway won't: point this at an interface on the OBD port.
[bus.diag]
iface = "can0"

[recorder]
minutes = 10
# dir = "/home/pi/captures"

# Off: frames the gate approves (RNS-E label/brightness) are logged, not sent.
[tx]
enabled = false

# Off: when the bus goes silent with Kl15 off, the shutdown is logged, not run.
[power]
shutdown = false

# Keys to LIVI through a uinput keyboard (needs deploy/99-carpi-uinput.rules).
[input]
uinput = true
