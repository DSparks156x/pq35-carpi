# carpid config. Copy to ~/.config/carpi/carpid.toml.
#
# Buses are named by role. `iface` is whatever the interface is called;
# naming interfaces with systemd-networkd .link files (e.g. "ican", "obd")
# beats relying on can0/can1 numbering.

[bus.ican]
iface = "can0"

# TT: the gateway routes diagnostics from ICAN, so diag shares it.
# Cars whose gateway won't: point this at an interface on the OBD port.
[bus.diag]
iface = "can0"

# RAM ring of every bus. Always holds at least [logs] capture_minutes.
[recorder]
minutes = 10

# Captures (docs/PAGES.md 3): ~/logs/<date>/<NN>/. A capture is the last
# capture_minutes of CAN and journal, the values, the config files and
# info.txt. Oldest unstarred entries go once the logs pass max_pct of the disk.
[logs]
dir = "~/logs"
capture_minutes = 5
max_pct = 25

# Set the Pi clock from the car's (0x65D) when they differ by more than
# 2 minutes and network time hasn't synced. Needs os/profile.sh (polkit rule)
# and the Pi's timezone set to the car's (profile --tz).
[clock]
set_from_car = true

# Off: frames the gate approves (RNS-E label/brightness) are logged, not sent.
[tx]
enabled = false

# Off: when the bus goes silent with Kl15 off, the shutdown is logged, not run.
[power]
shutdown = false

# Keys to LIVI through a uinput keyboard (needs deploy/99-carpi-uinput.rules).
# bindings: the whole key table, replacing the built-in one. Set it through
# the settings API, which writes it here.
[input]
uinput = true

# Light model (docs/PLAN.md 2.6). auto_brightness off: BB 00 once, then the
# RNS-E does its own thing. ambient_source: cluster, climatronic or blend.
# Ambient is log10(1 + raw) of the source. Learned mode bends the default
# curve towards your nudges; learned is written by carpid. The default curve,
# scroll trim and night threshold are guesses until a daylight-to-dark capture.
# dark_mode_source: headlights (Kl15 on) with the car clock when Kl15 is off,
# or ambient (night_threshold / night_hysteresis / night_dwell_s). The clock
# uses sunset/sunrise at latitude/longitude if set, else night_from-day_from.
[light]
auto_brightness = true
scroll_trim = true
ambient_source = "cluster"
curve_mode = "learned"
dark_mode_source = "headlights"
night_threshold = 1.0
night_hysteresis = 0.2
night_dwell_s = 10.0
# latitude = 52.5
# longitude = 13.4
# utc_offset_hours = 1.0
night_from = "19:00"
day_from = "07:00"

# Cluster display and the two top lines (top lines only while on TV).
# Off: nothing is sent to the cluster. Without readings, the page shows
# speed, rpm, coolant, outside temp, battery, fuel, odometer, dimmer.
[dis]
enabled = false
# "always": our default page holds the centre whenever nothing else wants it.
# "tab": idle as a tab in the cluster menu until it's picked there.
claim = "always"
default_page = "readings"   # or "accel", or "media" (the old client's start page)
# Per source: claim_* takes the centre when it gets content, release_* gives
# it back when the content goes (false: its screen stays up until a page is
# picked or something else claims).
claim_nav = true
release_nav = true
claim_phone = true
release_phone = true
claim_media = true
release_media = true
media_layout = "stack"      # or "art"
cover_flash_s = 4           # full cover on a new track once drawn; 0 = off
units = "auto"              # or "metric", "imperial" (auto: as the phone shows)
clock = "auto"              # or "12h", "24h" (auto: 12 h if the phone's ETA has AM/PM)

# Phone portal: http://<pi>:5003/files. Uploads need the PIN once one is set
# (set it through the settings API).
# Remove this section to turn the portal off.
[portal]
bind = "0.0.0.0:5003"

# Updates (carpi-update reads this too). See docs/DEPLOY.md section 3.
[update]
repo = "DSparks156x/pq35-carpi"
channel = "stable"
