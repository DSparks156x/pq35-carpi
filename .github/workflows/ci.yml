name: ci

on:
  push:
  pull_request:
  # release.yml runs this first, so a red test blocks a release.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the workspace doesn't use livi/ or sdlink/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The default job key keeps native tests separate from the Pi cross-check.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: first-install defaults and clock synchronization
        run: |
          python3 -B tools/test-options-config.py
          python3 -B tools/test-firstboot-clock.py
          python3 -B tools/test-firstboot-release.py
          python3 -B tools/test-install-avsd.py
          python3 -B tools/test-install-defer.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  pi:
    # Type-check for the Pi 5 (aarch64). Linking needs a cross linker; checking
    # doesn't, but ring (carpi-update's TLS) compiles C in its build script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the workspace doesn't use livi/ or sdlink/
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu
