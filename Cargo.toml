[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Drew Sparks"]
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
carpi-can = { path = "crates/carpi-can" }
carpi-state = { path = "crates/carpi-state" }
carpi-signals = { path = "crates/carpi-signals" }
carpi-nm = { path = "crates/carpi-nm" }
carpi-proto = { path = "crates/carpi-proto" }
carpi-core = { path = "crates/carpi-core" }
carpi-gate = { path = "crates/carpi-gate" }
carpi-power = { path = "crates/carpi-power" }
carpi-rnse = { path = "crates/carpi-rnse" }
carpi-light = { path = "crates/carpi-light" }
carpi-input = { path = "crates/carpi-input" }
carpi-tp2 = { path = "crates/carpi-tp2" }
carpi-kwp = { path = "crates/carpi-kwp" }
carpi-sim = { path = "crates/carpi-sim" }
carpi-diag = { path = "crates/carpi-diag" }
carpi-dis = { path = "crates/carpi-dis" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "signal", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
